# Look and feel for the whole app. Theme options are native Streamlit settings (no CSS hacks needed),
# and ui.py adds a small, defensive CSS layer on top. Light and dark follow the viewer's device;
# the viewer can switch in the app's Settings menu.

[browser]
gatherUsageStats = false

[theme]
# Typography: Inter for text, Space Grotesk for headings, JetBrains Mono for code.
# (Fonts load from Google Fonts; if blocked, the browser falls back to its default sans-serif.)
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.dark]
primaryColor = "#38bdf8"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#111a2e"
textColor = "#e6edf7"
linkColor = "#7dd3fc"
borderColor = "#243350"
dataframeBorderColor = "#1d2a45"
dataframeHeaderBackgroundColor = "#14203a"
codeBackgroundColor = "#0f182b"
greenColor = "#2bb673"
redColor = "#e5575b"
blueColor = "#38bdf8"
violetColor = "#a78bfa"

[theme.dark.sidebar]
backgroundColor = "#080d19"
secondaryBackgroundColor = "#101830"
borderColor = "#1b2740"

[theme.light]
primaryColor = "#0369a1"
backgroundColor = "#f5f8fc"
secondaryBackgroundColor = "#e9eff7"
textColor = "#0f172a"
linkColor = "#0369a1"
borderColor = "#d3deec"
dataframeBorderColor = "#d3deec"
dataframeHeaderBackgroundColor = "#e9eff7"
codeBackgroundColor = "#e9eff7"
greenColor = "#0b8a55"
redColor = "#cf3338"
blueColor = "#0369a1"
violetColor = "#6d4fd6"

[theme.light.sidebar]
backgroundColor = "#eaf0f8"
secondaryBackgroundColor = "#ffffff"
borderColor = "#d3deec"
